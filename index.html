      function paymentInstruction(method) {
        if (method === "Transfer Bank") return "Transfer ke BCA 1234567890 a.n Harmoni Stay. Konfirmasi setelah pembayaran.";
        if (method === "E-wallet") return "Bayar ke E-wallet 0812-0000-0000 a.n Harmoni Stay. Sertakan kode booking.";
        if (method === "Virtual Account") return "Virtual Account akan dibuat setelah admin mengonfirmasi booking.";
        return "Pembayaran kartu akan diverifikasi oleh tim Harmoni Stay sebelum check-in.";
      }

      function syncFiltersFromForm(form) {
        state.filters = {
          ...state.filters,
          query: form.elements.query ? form.elements.query.value.trim() : "",
          sort: form.elements.sort ? form.elements.sort.value : "recommended",
          minPrice: form.elements.minPrice ? form.elements.minPrice.value : "",
          maxPrice: form.elements.maxPrice ? form.elements.maxPrice.value : "",
          rating: form.elements.rating ? form.elements.rating.value : "",
          distance: form.elements.distance ? form.elements.distance.value : "",
          roomType: form.elements.roomType ? form.elements.roomType.value.trim() : "",
          facilities: Array.from(form.querySelectorAll('input[name="facility"]:checked')).map(input => input.value)
        };
      }

      function updateDraftFromBookingForm(form) {
        if (!state.bookingDraft) return;

        const d = state.bookingDraft;
        d.checkIn = form.elements.checkIn ? form.elements.checkIn.value : d.checkIn;
        d.checkOut = form.elements.checkOut ? form.elements.checkOut.value : d.checkOut;
        d.guests = Number(form.elements.guests ? form.elements.guests.value : d.guests);
        d.rooms = Number(form.elements.rooms ? form.elements.rooms.value : d.rooms);
        d.roomType = form.elements.roomType ? form.elements.roomType.value : d.roomType;
        d.qty = Number(form.elements.qty ? form.elements.qty.value : d.qty);
        d.guest.name = form.elements.guestName ? form.elements.guestName.value.trim() : "";
        d.guest.email = form.elements.guestEmail ? form.elements.guestEmail.value.trim() : "";
        d.guest.phone = form.elements.guestPhone ? form.elements.guestPhone.value.trim() : "";
        d.guest.notes = form.elements.notes ? form.elements.notes.value.trim() : "";
        d.promoCode = form.elements.promoCode ? form.elements.promoCode.value.trim().toUpperCase() : "";

        const checkedPayment = form.querySelector('input[name="paymentMethod"]:checked');
        if (checkedPayment) d.paymentMethod = checkedPayment.value;

        const hotel = getHotelById(d.hotelId);
        const room = hotel ? hotel.rooms.find(item => item.type === d.roomType) : null;
        const maxQty = room ? getRoomAvailability(d.hotelId, room.type, d.checkIn, d.checkOut) : 0;
        const qtyInput = form.elements.qty;
        if (qtyInput && maxQty > 0) {
          qtyInput.max = String(maxQty);
          if (Number(d.qty) > maxQty) {
            d.qty = maxQty;
            qtyInput.value = String(maxQty);
          }
        }

        updateBookingSummary();
      }

      function updateBookingSummary() {
        const summaryEl = document.getElementById("bookingSummary");
        if (!summaryEl) return;
        summaryEl.innerHTML = renderBookingSummary();

        const form = document.getElementById("bookingForm");
        if (!form) return;
        const totals = getBookingTotals();
        const submit = form.querySelector('button[type="submit"]');
        if (submit) submit.disabled = !totals.canBook;

        const qty = form.elements.qty;
        const hotel = getHotelById(state.bookingDraft.hotelId);
        const room = hotel ? hotel.rooms.find(item => item.type === state.bookingDraft.roomType) : null;
        if (qty && room) {
          const maxQty = getRoomAvailability(hotel.id, room.type, state.bookingDraft.checkIn, state.bookingDraft.checkOut);
          qty.max = String(maxQty);
        }
      }

      function applyPromoFromForm(form) {
        if (!state.bookingDraft) return;
        const code = (form.elements.promoCode ? form.elements.promoCode.value : "").trim().toUpperCase();
        state.bookingDraft.promoCode = code;

        if (!code) {
          toast("Kode promo dihapus.", "warning");
        } else if (defaultPromos[code]) {
          toast(`${defaultPromos[code].label} diterapkan.`, "success");
        } else {
          toast("Kode promo tidak valid.", "danger");
        }

        updateDraftFromBookingForm(form);
      }

      async function handleLogin(form) {
        const email = form.elements.email.value.trim().toLowerCase();
        const password = form.elements.password.value;
        const users = getStore(STORAGE.users, []);
        const user = users.find(item => item.email.toLowerCase() === email && item.password === password);

        if (!user) {
          toast("Email atau password tidak sesuai.", "danger");
          return;
        }

        setSession(user);
        closeModal();
        toast(`Selamat datang, ${user.name}.`, "success");
        render();
      }

      async function handleRegister(form) {
        const users = getStore(STORAGE.users, []);
        const name = form.elements.name.value.trim();
        const email = form.elements.email.value.trim().toLowerCase();
        const password = form.elements.password.value;

        if (users.some(user => user.email.toLowerCase() === email)) {
          toast("Email sudah terdaftar. Silakan login.", "danger");
          return;
        }

        if (password.length < 6) {
          toast("Password minimal 6 karakter.", "danger");
          return;
        }

        const user = {
          id: uid("u"),
          name,
          email,
          password,
          role: "customer",
          provider: "local",
          createdAt: new Date().toISOString()
        };

        users.push(user);
        setStore(STORAGE.users, users);
        setSession(user);
        closeModal();
        toast("Akun berhasil dibuat.", "success");
        render();
      }

      async function handleForgot(form) {
        const email = form.elements.email.value.trim().toLowerCase();
        const exists = getStore(STORAGE.users, []).some(user => user.email.toLowerCase() === email);

        if (exists) {
          toast("Tautan reset password telah dikirim ke email Anda.", "success");
        } else {
          toast("Email belum terdaftar.", "danger");
        }
      }

      async function handleBookingSubmit(form) {
        updateDraftFromBookingForm(form);
        const totals = getBookingTotals();

        if (!isAuth()) {
          toast("Silakan login untuk membuat booking.", "danger");
          openLogin();
          return;
        }

        if (!totals.canBook) {
          toast("Lengkapi tanggal, kamar, data tamu, dan pastikan ketersediaan masih ada.", "danger");
          return;
        }

        const d = state.bookingDraft;
        const bookings = getBookings();
        const booking = {
          id: uid("bkg"),
          proofNo: `BKG-${new Date().getFullYear()}-${String(bookings.length + 1).padStart(4, "0")}`,
          hotelId: d.hotelId,
          hotelName: totals.hotel.name,
          location: totals.hotel.location,
          roomType: d.roomType,
          qty: d.qty,
          guests: d.guests,
          rooms: d.rooms,
          checkIn: d.checkIn,
          checkOut: d.checkOut,
          guest: { ...d.guest },
          basePrice: totals.base,
          discount: totals.discount,
          serviceFee: totals.service,
          finalTotal: totals.total,
          promoCode: d.promoCode || "",
          paymentMethod: d.paymentMethod,
          paymentStatus: "Menunggu Pembayaran",
          status: "Aktif",
          createdAt: new Date().toISOString()
        };

        bookings.push(booking);
        saveBookings(bookings);
        state.bookingDraft = null;
        state.view = "myBookings";
        closeModal();
        toast(`Booking berhasil dibuat. Kode: ${booking.proofNo}`, "success");
        render();
      }

      async function handleHotelForm(form) {
        const id = form.dataset.hotelId;
        const hotels = getHotels();
        const selectedFacilities = Array.from(form.querySelectorAll('input[name="facilities"]:checked')).map(input => input.value);
        const urlPhotos = (form.elements.photos.value || "").split(/[\n,]/).map(item => item.trim()).filter(Boolean);
        const uploadedPhotos = await filesToDataUrls(form.elements.photoFiles.files);
        const photos = [...urlPhotos, ...uploadedPhotos].slice(0, 6);

        const payload = {
          name: form.elements.name.value.trim(),
          city: form.elements.city.value.trim(),
          location: form.elements.location.value.trim(),
          address: form.elements.address.value.trim(),
          distance: Number(form.elements.distance.value || 0),
          rating: Math.max(0, Math.min(5, Number(form.elements.rating.value || 0))),
          reviewCount: Math.max(0, Number(form.elements.reviewCount.value || 0)),
          facilities: selectedFacilities,
          description: form.elements.description.value.trim(),
          policies: form.elements.policies.value.trim(),
          photos: photos.length ? photos : [
            "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1400&q=85"
          ]
        };

        if (!payload.name || !payload.location || !payload.city) {
          toast("Nama, kota, dan lokasi hotel wajib diisi.", "danger");
          return;
        }

        if (id) {
          const index = hotels.findIndex(hotel => hotel.id === id);
          if (index >= 0) {
            hotels[index] = {
              ...hotels[index],
              ...payload,
              rooms: hotels[index].rooms || []
            };
          }
        } else {
          hotels.push({
            id: uid("h"),
            ...payload,
            rooms: []
          });
        }

        saveHotels(hotels);
        closeModal();
        toast("Hotel berhasil disimpan.", "success");
        render();
      }

      async function handleRoomForm(form) {
        const hotelId = form.dataset.hotelId;
        const roomId = form.dataset.roomId;
        const hotels = getHotels();
        const hotel = hotels.find(item => item.id === hotelId);
        if (!hotel) return;

        const payload = {
          id: roomId || uid("r"),
          type: form.elements.type.value.trim(),
          price: Number(form.elements.price.value || 0),
          available: Math.max(0, Number(form.elements.available.value || 0)),
          facilities: Array.from(form.querySelectorAll('input[name="roomFacilities"]:checked')).map(input => input.value)
        };

        if (!payload.type || payload.price < 0) {
          toast("Tipe kamar dan harga valid wajib diisi.", "danger");
          return;
        }

        if (roomId) {
          const index = hotel.rooms.findIndex(room => room.id === roomId);
          if (index >= 0) hotel.rooms[index] = { ...hotel.rooms[index], ...payload };
        } else {
          hotel.rooms.push(payload);
        }

        saveHotels(hotels);
        closeModal();
        toast("Kamar berhasil disimpan.", "success");
        render();
      }

      async function handleReviewForm(form) {
        const bookingId = form.dataset.bookingId;
        const hotelId = form.dataset.hotelId;
        const booking = getBookings().find(item => item.id === bookingId);

        if (!booking || bookingIsActive(booking)) {
          toast("Ulasan hanya dapat diberikan setelah check-out.", "danger");
          return;
        }

        const reviews = getReviews();
        if (reviews.some(review => review.bookingId === bookingId)) {
          toast("Anda sudah memberi ulasan untuk booking ini.", "warning");
          return;
        }

        const files = form.elements.photo.files;
        const photo = files && files[0] ? await fileToDataURL(files[0]) : "";
        const user = currentUser();

        reviews.push({
          id: uid("rev"),
          bookingId,
          hotelId,
          userId: user.id,
          userName: user.name,
          rating: Number(form.elements.rating.value),
          comment: form.elements.comment.value.trim(),
          photo,
          createdAt: new Date().toISOString()
        });

        saveReviews(reviews);
        updateHotelRatingFromReviews(hotelId);
        closeModal();
        toast("Ulasan berhasil dikirim. Terima kasih!", "success");
        render();
      }

      function updateHotelRatingFromReviews(hotelId) {
        const reviews = getReviews().filter(review => review.hotelId === hotelId);
        const hotel = getHotelById(hotelId);
        if (!hotel) return;

        if (!reviews.length) {
          hotel.rating = 0;
          hotel.reviewCount = 0;
        } else {
          const average = reviews.reduce((sum, review) => sum + Number(review.rating || 0), 0) / reviews.length;
          hotel.rating = Number(average.toFixed(1));
          hotel.reviewCount = reviews.length;
        }

        saveHotels(getHotels());
      }

      function googleLogin() {
        const users = getStore(STORAGE.users, []);
        let user = users.find(item => item.email === "google.demo@hotel.test");

        if (!user) {
          user = {
            id: uid("u"),
            name: "Google Demo",
            email: "google.demo@hotel.test",
            password: "",
            role: "customer",
            provider: "google",
            createdAt: new Date().toISOString()
          };
          users.push(user);
          setStore(STORAGE.users, users);
        }

        setSession(user);
        closeModal();
        toast("Login Google berhasil.", "success");
        render();
      }

      function logout() {
        localStorage.removeItem(STORAGE.session);
        toast("Anda telah logout.", "success");
        render();
      }

      function cancelBooking(bookingId) {
        const bookings = getBookings();
        const booking = bookings.find(item => item.id === bookingId);
        const user = currentUser();

        if (!booking) return;
        if (user && booking.guest.email !== user.email && !isAdmin()) {
          toast("Anda tidak memiliki akses untuk membatalkan booking ini.", "danger");
          return;
        }

        if (!bookingIsActive(booking)) {
          toast("Booking ini sudah tidak aktif.", "warning");
          return;
        }

        if (!confirm("Batalkan booking ini? Pembayaran yang sudah lunas akan ditandai refund.")) return;

        booking.status = "Dibatalkan";
        booking.paymentStatus = ["Lunas", "Dikonfirmasi"].includes(booking.paymentStatus) ? "Refund" : "Dibatalkan";
        saveBookings(bookings);
        toast("Booking dibatalkan.", "success");
        render();
      }

      function confirmBooking(bookingId) {
        const bookings = getBookings();
        const booking = bookings.find(item => item.id === bookingId);
        if (!booking) return;

        booking.paymentStatus = "Dikonfirmasi";
        if (booking.status === "Dibatalkan") booking.status = "Aktif";
        saveBookings(bookings);
        toast("Booking dikonfirmasi.", "success");
        render();
      }

      function markPaid(bookingId) {
        const bookings = getBookings();
        const booking = bookings.find(item => item.id === bookingId);
        if (!booking) return;

        booking.paymentStatus = "Lunas";
        booking.status = booking.checkOut < todayISO() ? "Selesai" : "Aktif";
        saveBookings(bookings);
        toast("Pembayaran ditandai lunas.", "success");
        render();
      }

      function refundBooking(bookingId) {
        const bookings = getBookings();
        const booking = bookings.find(item => item.id === bookingId);
        if (!booking) return;

        if (!confirm("Tandai booking ini dibatalkan dan refund?")) return;

        booking.paymentStatus = "Refund";
        booking.status = "Dibatalkan";
        saveBookings(bookings);
        toast("Booking ditandai refund.", "success");
        render();
      }

      function printBooking(bookingId) {
        const booking = getBookings().find(item => item.id === bookingId);
        if (!booking) return;

        const win = window.open("", "_blank");
        if (!win) {
          toast("Popup cetak diblokir browser.", "danger");
          return;
        }

        win.document.write(`
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8" />
            <title>Bukti Booking ${escapeHtml(booking.proofNo)}</title>
            <style>
              body { font-family: Arial, sans-serif; color: #1f2933; margin: 32px; }
              .box { border: 1px solid #ddd; border-radius: 18px; padding: 24px; }
              h1 { font-size: 24px; margin: 0 0 6px; }
              .muted { color: #667085; }
              .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
              .item { border: 1px solid #eee; background: #fafafa; border-radius: 12px; padding: 12px; }
              .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #667085; font-weight: 700; }
              .value { margin-top: 4px; font-weight: 700; }
              @media print { body { margin: 0; } .box { border: 0; } }
            </style>
          </head>
          <body>
            <div class="box">
              <h1>Bukti Booking Harmoni Stay</h1>
              <p class="muted">${escapeHtml(booking.proofNo)} · ${formatDateTime(booking.createdAt)}</p>
              <hr />
              <h2>${escapeHtml(booking.hotelName)}</h2>
              <p class="muted">${escapeHtml(booking.location)}</p>
              <div class="grid">
                <div class="item"><div class="label">Tamu</div><div class="value">${escapeHtml(booking.guest.name)}</div></div>
                <div class="item"><div class="label">Email</div><div class="value">${escapeHtml(booking.guest.email)}</div></div>
                <div class="item"><div class="label">Telepon</div><div class="value">${escapeHtml(booking.guest.phone)}</div></div>
                <div class="item"><div class="label">Tanggal</div><div class="value">${formatDate(booking.checkIn)} - ${formatDate(booking.checkOut)}</div></div>
                <div class="item"><div class="label">Kamar</div><div class="value">${escapeHtml(booking.roomType)} × ${escapeHtml(booking.qty)}</div></div>
                <div class="item"><div class="label">Total</div><div class="value">${currency(booking.finalTotal)}</div></div>
                <div class="item"><div class="label">Status booking</div><div class="value">${escapeHtml(booking.status)}</div></div>
                <div class="item"><div class="label">Status pembayaran</div><div class="value">${escapeHtml(booking.paymentStatus)}</div></div>
              </div>
              <p class="muted" style="margin-top:20px;">${escapeHtml(paymentInstruction(booking.paymentMethod))}</p>
            </div>
          </body>
          </html>
        `);
        win.document.close();
        win.focus();
        setTimeout(() => win.print(), 250);
      }

      function deleteHotel(hotelId) {
        const hotel = getHotelById(hotelId);
        if (!hotel) return;
        if (!confirm(`Hapus ${hotel.name}? Booking terkait juga akan dihapus.`)) return;

        saveHotels(getHotels().filter(item => item.id !== hotelId));
        saveBookings(getBookings().filter(booking => booking.hotelId !== hotelId));
        toast("Hotel dihapus.", "success");
        render();
      }

      function deleteRoom(hotelId, roomId) {
        const hotel = getHotelById(hotelId);
        if (!hotel) return;
        const room = hotel.rooms.find(item => item.id === roomId);
        if (!room) return;
        if (!confirm(`Hapus tipe kamar ${room.type}?`)) return;

        hotel.rooms = hotel.rooms.filter(item => item.id !== roomId);
        saveHotels(getHotels());
        toast("Kamar dihapus.", "success");
        render();
      }

      function deleteUser(userId) {
        const users = getStore(STORAGE.users, []);
        const user = users.find(item => item.id === userId);
        const current = currentUser();

        if (!user) return;
        if (current && user.email === current.email) {
          toast("Tidak dapat menghapus akun yang sedang digunakan.", "danger");
          return;
        }

        if (user.role === "admin" && users.filter(item => item.role === "admin").length <= 1) {
          toast("Harus ada minimal satu akun admin.", "danger");
          return;
        }

        if (!confirm(`Hapus pengguna ${user.name}?`)) return;

        setStore(STORAGE.users, users.filter(item => item.id !== userId));
        saveBookings(getBookings().filter(booking => !(booking.guest && booking.guest.email === user.email)));
        toast("Pengguna dihapus.", "success");
        render();
      }

      function changeUserRole(userId, role) {
        const users = getStore(STORAGE.users, []);
        const user = users.find(item => item.id === userId);
        const current = currentUser();

        if (!user || !["customer", "admin"].includes(role)) return;

        if (role !== "admin" && user.role === "admin" && users.filter(item => item.role === "admin").length <= 1) {
          toast("Harus ada minimal satu akun admin.", "danger");
          render();
          return;
        }

        if (current && user.email === current.email && role !== "admin") {
          toast("Anda tidak dapat menurunkan role akun sendiri.", "danger");
          render();
          return;
        }

        user.role = role;
        setStore(STORAGE.users, users);
        toast("Role pengguna diperbarui.", "success");
        render();
      }

      function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function filesToDataUrls(files) {
        const result = [];
        for (const file of Array.from(files || []).slice(0, 4)) {
          if (file.size > 1.5 * 1024 * 1024) {
            toast(`Foto "${file.name}" dilewati karena lebih dari 1.5 MB.`, "warning");
            continue;
          }
          result.push(await fileToDataURL(file));
        }
        return result;
      }

      function toast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        if (!container) return;

        const id = uid("toast");
        const node = document.createElement("div");
        node.id = id;
        node.className = `toast ${type}`;
        node.textContent = message;
        container.appendChild(node);

        setTimeout(() => node.classList.add("show"), 20);
        setTimeout(() => {
          node.classList.remove("show");
          setTimeout(() => node.remove(), 260);
        }, 3600);
      }

      document.addEventListener("click", async event => {
        const el = event.target.closest("[data-action]");
        if (!el) return;

        const action = el.dataset.action;
        if (action !== "closeModal" || el.id === "modalOverlay") event.preventDefault();

        if (action === "navigate") {
          state.view = el.dataset.view;
          if (state.view !== "admin") state.adminTab = "dashboard";
          render();
        }

        if (action === "openLogin") openLogin();
        if (action === "openRegister") openRegister();
        if (action === "openForgot") openForgot();
        if (action === "googleLogin") googleLogin();
        if (action === "logout") logout();

        if (action === "detailHotel") {
          state.currentHotelId = el.dataset.hotelId;
          state.view = "detail";
          render();
        }

        if (action === "resetFilters") {
          state.filters = defaultFilters();
          render();
        }

        if (action === "bookNow") {
          if (!isAuth()) {
            toast("Silakan login untuk melanjutkan booking.", "warning");
            openLogin();
            return;
          }

          const hotel = getHotelById(el.dataset.hotelId);
          const roomType = el.dataset.roomType || (hotel && hotel.rooms[0] ? hotel.rooms[0].type : "");
          state.bookingDraft = {
            ...defaultBookingDraft(),
            hotelId: el.dataset.hotelId,
            roomType,
            qty: Number(el.dataset.qty || 1),
            guests: Number(el.dataset.guests || 2),
            rooms: Number(el.dataset.rooms || 1)
          };
          state.view = "booking";
          render();
        }

        if (action === "applyPromo") {
          applyPromoFromForm(el.closest("form"));
        }

        if (action === "bookingTab") {
          state.activeBookingTab = el.dataset.tab;
          render();
        }

        if (action === "detailBooking") openBookingDetail(el.dataset.bookingId);
        if (action === "printBooking") printBooking(el.dataset.bookingId);
        if (action === "cancelBooking") cancelBooking(el.dataset.bookingId);
        if (action === "openReview") openReview(el.dataset.bookingId);

        if (action === "adminTab") {
          state.adminTab = el.dataset.tab;
          render();
        }

        if (action === "adminBookingFilter") {
          state.adminBookingFilter = el.dataset.filter;
          render();
        }

        if (action === "openHotelModal") openHotelModal(el.dataset.hotelId);
        if (action === "deleteHotel") deleteHotel(el.dataset.hotelId);
        if (action === "openRoomModal") openRoomModal(el.dataset.hotelId, el.dataset.roomId);
        if (action === "deleteRoom") deleteRoom(el.dataset.hotelId, el.dataset.roomId);
        if (action === "deleteUser") deleteUser(el.dataset.userId);

        if (action === "confirmBooking") confirmBooking(el.dataset.bookingId);
        if (action === "markPaid") markPaid(el.dataset.bookingId);
        if (action === "refundBooking") refundBooking(el.dataset.bookingId);

        if (action === "closeModal") closeModal();
      });

      document.addEventListener("submit", async event => {
        const form = event.target;

        if (form.id === "searchForm") {
          event.preventDefault();
          state.filters = {
            ...state.filters,
            query: form.elements.query.value.trim(),
            checkIn: form.elements.checkIn.value,
            checkOut: form.elements.checkOut.value,
            guests: form.elements.guests.value,
            rooms: form.elements.rooms.value
          };
          state.view = "hotels";
          render();
        }

        if (form.id === "loginForm") {
          event.preventDefault();
          await handleLogin(form);
        }

        if (form.id === "registerForm") {
          event.preventDefault();
          await handleRegister(form);
        }

        if (form.id === "forgotForm") {
          event.preventDefault();
          await handleForgot(form);
        }

        if (form.id === "bookingForm") {
          event.preventDefault();
          await handleBookingSubmit(form);
        }

        if (form.id === "adminHotelForm") {
          event.preventDefault();
          await handleHotelForm(form);
        }

        if (form.id === "adminRoomForm") {
          event.preventDefault();
          await handleRoomForm(form);
        }

        if (form.id === "reviewForm") {
          event.preventDefault();
          await handleReviewForm(form);
        }
      });

      document.addEventListener("input", event => {
        const filterForm = event.target.closest("#filterForm");
        if (filterForm && event.target.name === "query") {
          syncFiltersFromForm(filterForm);
          render();
        }

        const bookingForm = event.target.closest("#bookingForm");
        if (bookingForm && ["INPUT", "TEXTAREA"].includes(event.target.tagName)) {
          updateDraftFromBookingForm(bookingForm);
        }
      });

      document.addEventListener("change", event => {
        const filterForm = event.target.closest("#filterForm");
        if (filterForm) {
          syncFiltersFromForm(filterForm);
          render();
          return;
        }

        if (event.target.dataset.action === "adminHotelSelect") {
          state.adminHotelId = event.target.value;
          render();
          return;
        }

        if (event.target.dataset.action === "changeUserRole") {
          changeUserRole(event.target.dataset.userId, event.target.value);
          return;
        }

        const bookingForm = event.target.closest("#bookingForm");
        if (bookingForm) {
          updateDraftFromBookingForm(bookingForm);
        }
      });

      seedData();
      state.adminHotelId = getHotels()[0] ? getHotels()[0].id : "";
      render();
    })();
  </script>
</body>
</html>
