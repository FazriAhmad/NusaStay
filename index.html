<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmoni Stay - Booking Hotel</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: #ffffff;
      --surface-soft: #fbfaf7;
      --text: #1f2933;
      --muted: #667085;
      --muted-2: #98a2b3;
      --line: #e7e4dc;
      --primary: #315f58;
      --primary-dark: #244843;
      --primary-soft: #e7efeb;
      --accent: #c8a46a;
      --accent-soft: #f4ecdf;
      --danger: #b45353;
      --danger-soft: #fdecea;
      --success: #4f8f72;
      --success-soft: #e8f4ee;
      --warning: #b7791f;
      --warning-soft: #fff4dc;
      --shadow: 0 18px 50px rgba(31, 41, 51, 0.08);
      --shadow-soft: 0 10px 30px rgba(31, 41, 51, 0.06);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(200, 164, 106, 0.14), transparent 34rem),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 58%, #f3f1eb 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      letter-spacing: -0.01em;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(251, 250, 247, 0.82);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(231, 228, 220, 0.8);
    }

    .topbar-inner {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      letter-spacing: -0.06em;
      box-shadow: 0 12px 24px rgba(49, 95, 88, 0.22);
    }

    .brand strong {
      display: block;
      font-size: 1rem;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(231, 228, 220, 0.8);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
    }

    .nav-links a {
      padding: 9px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.92rem;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--text);
      background: #fff;
      box-shadow: 0 8px 18px rgba(31, 41, 51, 0.06);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .user-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px 7px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 0.88rem;
      box-shadow: 0 8px 22px rgba(31, 41, 51, 0.04);
    }

    .main {
      min-height: 68vh;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    .section {
      padding: 72px 0;
    }

    .section.compact {
      padding: 44px 0;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    h1,
    h2,
    h3,
    h4 {
      margin: 0;
      line-height: 1.15;
      letter-spacing: -0.045em;
    }

    h1 {
      font-size: clamp(2.35rem, 7vw, 5.2rem);
      max-width: 760px;
    }

    h2 {
      font-size: clamp(1.75rem, 4vw, 3rem);
    }

    h3 {
      font-size: 1.2rem;
    }

    h4 {
      font-size: 1rem;
    }

    p {
      margin: 0;
    }

    .lead {
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 0.88rem;
    }

    .card,
    .hotel-card,
    .room-card,
    .booking-card,
    .summary-card,
    .filters-card,
    .admin-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(231, 228, 220, 0.9);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-soft);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 72px 0 54px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      gap: 34px;
      align-items: center;
    }

    .hero-panel {
      position: relative;
      overflow: hidden;
      min-height: 440px;
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(49, 95, 88, 0.9), rgba(49, 95, 88, 0.32)),
        url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=85") center/cover;
      box-shadow: var(--shadow);
    }

    .hero-panel::after {
      content: "";
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 28px;
      pointer-events: none;
    }

    .hero-badge {
      position: absolute;
      left: 34px;
      bottom: 34px;
      right: 34px;
      padding: 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    .hero-badge strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.1rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .search-panel {
      display: grid;
      grid-template-columns: 1.35fr repeat(4, minmax(110px, 0.65fr)) auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(231, 228, 220, 0.9);
      box-shadow: var(--shadow);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: 0.18s ease;
    }

    .input,
    .select {
      min-height: 46px;
      padding: 0 14px;
    }

    .textarea {
      min-height: 104px;
      padding: 13px 14px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: rgba(49, 95, 88, 0.55);
      box-shadow: 0 0 0 4px rgba(49, 95, 88, 0.1);
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 17px;
      border-radius: 999px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      cursor: pointer;
      font-weight: 750;
      font-size: 0.92rem;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(31, 41, 51, 0.08);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }

    .btn-ghost:hover {
      background: #fff;
      border-color: var(--line);
      color: var(--text);
    }

    .btn-soft {
      background: var(--primary-soft);
      border-color: rgba(49, 95, 88, 0.12);
      color: var(--primary);
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: rgba(180, 83, 83, 0.16);
      color: var(--danger);
    }

    .btn-warning {
      background: var(--warning-soft);
      border-color: rgba(183, 121, 31, 0.18);
      color: var(--warning);
    }

    .btn.full {
      width: 100%;
    }

    .link-btn {
      padding: 0;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .stats-grid,
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      padding: 22px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
    }

    .stat-card strong {
      display: block;
      margin-bottom: 5px;
      font-size: 1.65rem;
      letter-spacing: -0.05em;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .hotel-card {
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .hotel-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .hotel-media {
      position: relative;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #e7e4dc;
    }

    .hotel-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .hotel-card:hover .hotel-media img {
      transform: scale(1.035);
    }

    .distance-badge,
    .promo-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .hotel-body {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .hotel-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-weight: 800;
      font-size: 0.92rem;
    }

    .stars {
      color: var(--accent);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .facility-row,
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip,
    .facility-chip,
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .badge.success {
      background: var(--success-soft);
      border-color: rgba(79, 143, 114, 0.2);
      color: var(--success);
    }

    .badge.warning {
      background: var(--warning-soft);
      border-color: rgba(183, 121, 31, 0.2);
      color: var(--warning);
    }

    .badge.danger {
      background: var(--danger-soft);
      border-color: rgba(180, 83, 83, 0.18);
      color: var(--danger);
    }

    .badge.neutral {
      background: #f3f1eb;
      color: var(--muted);
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .price {
      font-weight: 850;
      letter-spacing: -0.03em;
    }

    .price small {
      color: var(--muted);
      font-weight: 650;
    }

    .filters-card {
      padding: 18px;
      margin-bottom: 22px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1.2fr repeat(6, minmax(120px, 0.65fr));
      gap: 12px;
      align-items: end;
    }

    .checkbox-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }

    .check input {
      accent-color: var(--primary);
    }

    .detail-hero {
      padding: 34px 0 24px;
    }

    .detail-grid-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 22px;
      align-items: start;
    }

    .detail-gallery {
      display: grid;
      grid-template-columns: 1.6fr 0.8fr;
      gap: 12px;
    }

    .detail-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 24px;
      background: #e7e4dc;
    }

    .detail-gallery .large {
      min-height: 420px;
    }

    .thumbs {
      display: grid;
      gap: 12px;
    }

    .thumbs img {
      min-height: 204px;
    }

    .detail-info {
      padding: 24px;
    }

    .detail-info-body {
      display: grid;
      gap: 16px;
    }

    .room-list {
      display: grid;
      gap: 14px;
    }

    .room-card {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .room-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
    }

    .availability {
      color: var(--success);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .availability.low {
      color: var(--warning);
    }

    .summary-card {
      position: sticky;
      top: 96px;
      padding: 20px;
      display: grid;
      gap: 16px;
      align-self: start;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .summary-line strong {
      color: var(--text);
    }

    .summary-total {
      padding-top: 8px;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .booking-layout,
    .admin-layout {
      display: grid;
      gap: 22px;
    }

    .booking-layout {
      grid-template-columns: minmax(0, 1fr) 360px;
      align-items: start;
    }

    .form-card {
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .payment-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .payment-option {
      position: relative;
    }

    .payment-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .payment-option span {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--muted);
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .payment-option input:checked + span {
      border-color: rgba(49, 95, 88, 0.55);
      background: var(--primary-soft);
      color: var(--primary);
      box-shadow: 0 0 0 4px rgba(49, 95, 88, 0.08);
    }

    .empty-state {
      padding: 54px 24px;
      text-align: center;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.72);
      border: 1px dashed var(--line);
    }

    .empty-state h2 {
      margin-bottom: 10px;
    }

    .empty-state p {
      max-width: 560px;
      margin: 0 auto 20px;
      color: var(--muted);
    }

    .booking-list {
      display: grid;
      gap: 14px;
    }

    .booking-card {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .booking-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-shell {
      padding-top: 34px;
    }

    .admin-layout {
      grid-template-columns: 245px minmax(0, 1fr);
      align-items: start;
    }

    .admin-sidebar {
      position: sticky;
      top: 96px;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
    }

    .admin-sidebar button {
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 8px;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
      border-radius: 14px;
      box-shadow: none;
    }

    .admin-sidebar button:hover,
    .admin-sidebar button.active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .admin-content {
      display: grid;
      gap: 18px;
    }

    .admin-card {
      padding: 22px;
    }

    .admin-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .hotel-admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .hotel-admin-card {
      padding: 18px;
      display: grid;
      gap: 12px;
      border-radius: 20px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 0.9rem;
    }

    th {
      background: #faf9f5;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .bar-list {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(120px, 0.8fr) 1fr 48px;
      gap: 12px;
      align-items: center;
    }

    .bar {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #ece8dd;
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .review-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      display: grid;
      gap: 10px;
    }

    .review-photo {
      width: 96px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .stack {
      display: grid;
      gap: 14px;
    }

    .auth-card {
      max-width: 460px;
      margin: 0 auto;
      padding: 24px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.84rem;
    }

        const session = getSession();
        if (!session) return null;
        return getStore(STORAGE.users, []).find(user => user.id === session.userId) || null;
      }

        return Boolean(currentUser());

        const user = currentUser();
        return Boolean(user && user.role === "admin");

        return getHotels().find(hotel => hotel.id === id);

        const date = new Date();
        date.setHours(0, 0, 0, 0);
        return date.toISOString().slice(0, 10);
      }

      function addDaysISO(days) {
        const date = new Date();
        date.setHours(0, 0, 0, 0);
        date.setDate(date.getDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function dateDiff(checkIn, checkOut) {
        if (!checkIn || !checkOut) return 0;
        const start = new Date(checkIn + "T00:00:00");
        const end = new Date(checkOut + "T00:00:00");
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return 0;
        return Math.max(0, Math.round((end - start) / 86400000));
      }

      function formatDate(value) {
        if (!value) return "-";
        const date = new Date(value + "T00:00:00");
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
      }

      function formatDateTime(value) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        return date.toLocaleString("id-ID", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function currency(value) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }).format(Number(value) || 0);

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char]));

        if (!checkIn || !checkOut) return Number(room.available || 0);

        const start = new Date(checkIn + "T00:00:00");
        const end = new Date(checkOut + "T00:00:00");
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return Number(room.available || 0);

        const booked = getBookings()
          .filter(booking => {
            if (booking.hotelId !== hotelId || booking.roomType !== roomType) return false;
            if (booking.status === "Dibatalkan" || booking.paymentStatus === "Refund" || booking.paymentStatus === "Dibatalkan") return false;
            const bookingStart = new Date(booking.checkIn + "T00:00:00");
            const bookingEnd = new Date(booking.checkOut + "T00:00:00");
            return bookingStart < end && bookingEnd > start;
          })
          .reduce((sum, booking) => sum + Number(booking.qty || 0), 0);

        return Math.max(0, Number(room.available || 0) - booked);
      }

      function getFilteredHotels() {
        const filters = state.filters;
        const query = filters.query.trim().toLowerCase();

        let hotels = getHotels().filter(hotel => {
          const searchable = [hotel.name, hotel.location, hotel.city, hotel.address].join(" ").toLowerCase();
          const price = getMinPrice(hotel);
          const matchesQuery = !query || searchable.includes(query);
          const matchesPrice = (!filters.minPrice || price >= Number(filters.minPrice)) && (!filters.maxPrice || price <= Number(filters.maxPrice));
          const matchesRating = !filters.rating || hotel.rating >= Number(filters.rating);
          const matchesDistance = !filters.distance || hotel.distance <= Number(filters.distance);
          const matchesRoomType = !filters.roomType || (hotel.rooms || []).some(room => room.type.toLowerCase().includes(filters.roomType.toLowerCase()));
          const matchesFacilities = !filters.facilities.length || filters.facilities.every(facility => hotel.facilities.includes(facility));
          const matchesAvailability = !filters.checkIn || !filters.checkOut || (hotel.rooms || []).some(room => getRoomAvailability(hotel.id, room.type, filters.checkIn, filters.checkOut) >= 1);

          return matchesQuery && matchesPrice && matchesRating && matchesDistance && matchesRoomType && matchesFacilities && matchesAvailability;
        });

        hotels.sort((a, b) => {
          const priceA = getMinPrice(a);
          const priceB = getMinPrice(b);

          if (filters.sort === "priceAsc") return priceA - priceB;
          if (filters.sort === "priceDesc") return priceB - priceA;
          if (filters.sort === "rating") return b.rating - a.rating;
          if (filters.sort === "distance") return a.distance - b.distance;
          if (filters.sort === "name") return a.name.localeCompare(b.name);
          return b.rating * b.reviewCount - a.rating * a.reviewCount;
        });

        return hotels;
      }

      function getBookingTotals(draft = state.bookingDraft) {
        if (!draft) {
          return {
            hotel: null,
            room: null,
            nights: 0,
            available: 0,
            base: 0,
            discount: 0,
            service: 0,
            total: 0,
            promo: null,
            validDates: false,
            canBook: false
          };
        }

        const hotel = getHotelById(draft.hotelId);
        const room = hotel && hotel.rooms ? hotel.rooms.find(item => item.type === draft.roomType) : null;
        const nights = dateDiff(draft.checkIn, draft.checkOut);
        const available = room ? getRoomAvailability(draft.hotelId, draft.roomType, draft.checkIn, draft.checkOut) : 0;
        const base = room ? Number(room.price || 0) * nights * Number(draft.qty || 0) : 0;
        const promo = defaultPromos[(draft.promoCode || "").toUpperCase()];
        const discount = promo ? Math.round(base * promo.percent / 100) : 0;
        const service = Math.round(Math.max(0, base - discount) * 0.05);
        const total = Math.max(0, base - discount + service);
        const validDates = Boolean(draft.checkIn && draft.checkOut && nights > 0);
        const guestComplete = Boolean(draft.guest && draft.guest.name && draft.guest.email && draft.guest.phone);
        const canBook = Boolean(hotel && room && validDates && available >= Number(draft.qty || 0) && guestComplete && draft.paymentMethod);

        return { hotel, room, nights, available, base, discount, service, total, promo, validDates, canBook };
      }

              <button class="btn btn-soft" type="button" data-action="bookNow" data-hotel-id="${escapeHtml(hotel.id)}" data-room-type="${escapeHtml(room.type)}" data-qty="1" ${available ? "" : "disabled"}>
                Pilih kamar
              </button>
            </div>
          </article>
        `;
      }

      function renderReviewCard(review) {
        return `
          <div class="review-card" style="margin-top:12px;">
            <div style="display:flex; justify-content:space-between; gap:12px; align-items:start;">
              <div>
                <strong>${escapeHtml(review.userName)}</strong>
                <p class="muted small">${formatDate(review.createdAt)}</p>
              </div>
              <div>${renderStars(review.rating)}</div>
            </div>
            <p class="muted">${escapeHtml(review.comment)}</p>
            ${review.photo ? `<img class="review-photo" src="${escapeHtml(review.photo)}" alt="Foto pengalaman menginap" loading="lazy" />` : ""}
          </div>
        `;
      }

      function renderBooking() {
        if (!state.bookingDraft || !state.bookingDraft.hotelId) {
          return `
            <section class="section">
              <div class="container">
                <div class="empty-state">
                  <h2>Belum ada kamar dipilih</h2>
                  <p>Pilih hotel dan tipe kamar terlebih dahulu untuk memulai pemesanan.</p>
                  <button class="btn btn-primary" type="button" data-action="navigate" data-view="hotels">Cari hotel</button>
                </div>
              </div>
            </section>
          `;
        }

        if (!isAuth()) {
          return `
            <section class="section">
              <div class="container">
                <div class="empty-state">
                  <h2>Masuk untuk melanjutkan booking</h2>
                  <p>Anda perlu login atau mendaftar agar data tamu dan riwayat booking tersimpan.</p>
                  <div class="hero-actions" style="justify-content:center;">
                    <button class="btn btn-primary" type="button" data-action="openLogin">Login</button>
                    <button class="btn btn-ghost" type="button" data-action="openRegister">Daftar akun</button>
                  </div>
                </div>
              </div>
            </section>
          `;
        }

        const draft = state.bookingDraft;
        const hotel = getHotelById(draft.hotelId);
        if (!hotel) {
          return `
            <section class="section">
              <div class="container">
                <div class="empty-state">
                  <h2>Hotel tidak tersedia</h2>
                  <p>Hotel yang dipilih sudah tidak ditemukan.</p>
                  <button class="btn btn-primary" type="button" data-action="navigate" data-view="hotels">Kembali ke daftar hotel</button>
                </div>
              </div>
            </section>
          `;
        }

        const selectedRoom = hotel.rooms.find(room => room.type === draft.roomType) || hotel.rooms[0];
        const maxQty = selectedRoom ? getRoomAvailability(hotel.id, selectedRoom.type, draft.checkIn, draft.checkOut) : 0;

        return `
          <section class="section">
            <div class="container booking-layout">
              <div class="card form-card">
                <div>
                  <span class="eyebrow">Booking kamar</span>
                  <h2>${escapeHtml(hotel.name)}</h2>
                  <p class="muted" style="margin-top:8px;">${escapeHtml(hotel.location)}</p>
                </div>

                <form id="bookingForm" autocomplete="off">
                  <div class="form-grid three">
                    <div class="field">
                      <label for="draftCheckIn">Check-in</label>
                      <input id="draftCheckIn" class="input" name="checkIn" type="date" min="${todayISO()}" value="${escapeHtml(draft.checkIn)}" required />
                    </div>
                    <div class="field">
                      <label for="draftCheckOut">Check-out</label>
                      <input id="draftCheckOut" class="input" name="checkOut" type="date" min="${todayISO()}" value="${escapeHtml(draft.checkOut)}" required />
                    </div>
                    <div class="field">
                      <label for="draftRoomType">Tipe kamar</label>
                      <select id="draftRoomType" class="select" name="roomType">
                        ${hotel.rooms.length ? hotel.rooms.map(room => `
                          <option value="${escapeHtml(room.type)}" ${room.type === draft.roomType ? "selected" : ""}>
                            ${escapeHtml(room.type)} · ${currency(room.price)} / malam
                          </option>
                        `).join("") : `<option value="">Tidak ada kamar tersedia</option>`}
                      </select>
                    </div>
                    <div class="field">
                      <label for="draftQty">Jumlah kamar</label>
                      <input id="draftQty" class="input" name="qty" type="number" min="1" max="${Math.max(1, maxQty)}" value="${escapeHtml(draft.qty)}" required />
                    </div>
                    <div class="field">
                      <label for="draftGuests">Jumlah tamu</label>
                      <select id="draftGuests" class="select" name="guests">${renderNumberOptions(1, 8, draft.guests)}</select>
                    </div>
                    <div class="field">
                      <label for="draftRooms">Total kamar dipesan</label>
                      <select id="draftRooms" class="select" name="rooms">${renderNumberOptions(1, 5, draft.rooms)}</select>
                    </div>
                  </div>

                  <div class="form-grid">
                    <div class="field">
                      <label for="guestName">Nama tamu utama</label>
                      <input id="guestName" class="input" name="guestName" value="${escapeHtml(draft.guest.name)}" placeholder="Nama lengkap" required />
                    </div>
                    <div class="field">
                      <label for="guestEmail">Email</label>
                      <input id="guestEmail" class="input" name="guestEmail" type="email" value="${escapeHtml(draft.guest.email)}" placeholder="email@example.com" required />
                    </div>
                    <div class="field">
                      <label for="guestPhone">Nomor WhatsApp / telepon</label>
                      <input id="guestPhone" class="input" name="guestPhone" value="${escapeHtml(draft.guest.phone)}" placeholder="08xxxxxxxxxx" required />
                    </div>
                    <div class="field">
                      <label for="guestNotes">Catatan khusus</label>
                      <input id="guestNotes" class="input" name="notes" value="${escapeHtml(draft.guest.notes)}" placeholder="Opsional" />
                    </div>
                  </div>

                  <div class="form-grid">
                    <div class="field">
                      <label for="promoCode">Kode promo / voucher</label>
                      <div style="display:flex; gap:10px;">
                        <input id="promoCode" class="input" name="promoCode" value="${escapeHtml(draft.promoCode)}" placeholder="HOLIDAY10" style="text-transform:uppercase;" />
                        <button class="btn btn-soft" type="button" data-action="applyPromo">Terapkan</button>
                      </div>
                      <p class="muted small" style="margin-top:6px;">Coba: HOLIDAY10, STAY5, FIRSTBOOKING</p>
                    </div>
                    <div class="field">
                      <label>Metode pembayaran</label>
                      <div class="payment-options">
                        ${paymentMethods.map(method => `
                          <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="${escapeHtml(method)}" ${draft.paymentMethod === method ? "checked" : ""} />
                            <span>${escapeHtml(method)}</span>
                          </label>
                        `).join("")}
                      </div>
                    </div>
                  </div>

                  <p id="bookingAvailability" class="muted small"></p>

                  <button class="btn btn-primary full" type="submit">Buat reservasi</button>
                </form>
              </div>

              <aside id="bookingSummary" class="summary-card">
                ${renderBookingSummary()}
              </aside>
            </div>
          </section>
        `;
      }

      function renderBookingSummary() {
        const totals = getBookingTotals();

        if (!totals.hotel || !totals.room) {
          return `
            <div>
              <span class="eyebrow">Ringkasan pesanan</span>
              <h3>Pilih kamar untuk melihat ringkasan</h3>
            </div>
          `;
        }

        const d = state.bookingDraft;
        const promoText = totals.promo ? totals.promo.label : (d.promoCode ? "Kode promo tidak valid" : "Tidak ada promo");
        const dateNote = totals.validDates ? `${formatDate(d.checkIn)} - ${formatDate(d.checkOut)} · ${totals.nights} malam` : "Pilih tanggal yang valid";
        const availabilityText = totals.available >= Number(d.qty || 0)
          ? `Tersedia ${totals.available} kamar untuk tanggal ini.`
          : `Hanya tersedia ${totals.available} kamar. Kurangi jumlah kamar atau ubah tanggal.`;

        return `
          <div>
            <span class="eyebrow">Ringkasan pesanan</span>
            <h3>${escapeHtml(totals.hotel.name)}</h3>
            <p class="muted small" style="margin-top:6px;">${escapeHtml(totals.hotel.location)}</p>
          </div>
          <div class="summary-line"><span>Tanggal</span><strong>${escapeHtml(dateNote)}</strong></div>
          <div class="summary-line"><span>Kamar</span><strong>${escapeHtml(d.roomType)} × ${escapeHtml(d.qty)}</strong></div>
          <div class="summary-line"><span>Promo</span><strong>${escapeHtml(promoText)}</strong></div>
          <div class="summary-line"><span>Subtotal</span><strong>${currency(totals.base)}</strong></div>
          <div class="summary-line"><span>Diskon</span><strong>-${currency(totals.discount)}</strong></div>
          <div class="summary-line"><span>Biaya layanan</span><strong>${currency(totals.service)}</strong></div>
          <div class="summary-line summary-total"><span>Total</span><strong>${currency(totals.total)}</strong></div>
          <p id="bookingAvailability" class="muted small">${escapeHtml(availabilityText)}</p>
          ${totals.canBook ? `<span class="badge success">Siap diproses</span>` : `<span class="badge warning">Lengkapi data booking</span>`}
        `;
      }

      function renderMyBookings() {
        if (!isAuth()) {
          return `
            <section class="section">
              <div class="container">
                <div class="empty-state">
                  <h2>Booking Saya</h2>
                  <p>Masuk untuk melihat booking aktif, riwayat, detail reservasi, bukti booking, dan ulasan.</p>
                  <div class="hero-actions" style="justify-content:center;">
                    <button class="btn btn-primary" type="button" data-action="openLogin">Login</button>
                    <button class="btn btn-ghost" type="button" data-action="openRegister">Daftar akun</button>
                  </div>
                </div>
              </div>
            </section>
          `;
        }

        const user = currentUser();
        const bookings = getBookings()
          .filter(booking => booking.guest && booking.guest.email === user.email)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const active = bookings.filter(bookingIsActive);
        const history = bookings.filter(booking => !bookingIsActive(booking));
        const list = state.activeBookingTab === "active" ? active : history;

        return `
          <section class="section">
            <div class="container">
              <div class="section-heading">
                <div>
                  <span class="eyebrow">Booking Saya</span>
                  <h2>Kelola reservasi Anda</h2>
                  <p class="muted" style="margin-top:8px;">Lihat status pembayaran, cetak bukti, batalkan booking, atau beri ulasan.</p>
                </div>
              </div>

              <div class="card" style="padding:12px; margin-bottom:18px;">
                <div class="card-actions" style="padding:4px;">
                  <button class="btn ${state.activeBookingTab === "active" ? "btn-primary" : "btn-ghost"}" type="button" data-action="bookingTab" data-tab="active">Booking aktif</button>
                  <button class="btn ${state.activeBookingTab === "history" ? "btn-primary" : "btn-ghost"}" type="button" data-action="bookingTab" data-tab="history">Riwayat booking</button>
                </div>
              </div>

              ${list.length ? `
                <div class="booking-list">
                  ${list.map(renderBookingCard).join("")}
                </div>
              ` : `
                <div class="empty-state">
                  <h2>${state.activeBookingTab === "active" ? "Belum ada booking aktif" : "Belum ada riwayat booking"}</h2>
                  <p>${state.activeBookingTab === "active" ? "Booking yang sudah dibuat akan muncul di sini." : "Setelah check-out selesai, riwayat menginap akan muncul di sini."}</p>
                  <button class="btn btn-primary" type="button" data-action="navigate" data-view="hotels">Cari hotel</button>
                </div>
              `}
            </div>
          </section>
        `;
      }

      function bookingIsActive(booking) {
        return booking.status !== "Dibatalkan" && booking.checkOut >= todayISO();
      }

      function renderBookingCard(booking) {
        const reviewed = getReviews().some(review => review.bookingId === booking.id);
        const canReview = !bookingIsActive(booking) && booking.status !== "Dibatalkan" && !reviewed;

        return `
          <article class="booking-card">
            <div style="display:flex; justify-content:space-between; gap:14px; align-items:start;">
              <div>
                <span class="eyebrow">${escapeHtml(booking.proofNo)}</span>
                <h3>${escapeHtml(booking.hotelName)}</h3>
                <p class="muted small">${escapeHtml(booking.location)}</p>
              </div>
              <div style="text-align:right;">
                <div class="price">${currency(booking.finalTotal)}</div>
                <p class="muted small">${formatDate(booking.checkIn)} - ${formatDate(booking.checkOut)}</p>
              </div>
            </div>

            <div class="booking-meta">
              <span>${escapeHtml(booking.roomType)} × ${escapeHtml(booking.qty)}</span>
              <span>${escapeHtml(booking.paymentMethod)}</span>
              <span>${escapeHtml(booking.guest.name)}</span>
            </div>

            <div class="card-actions">
              ${badge(booking.status)}
              ${badge(booking.paymentStatus)}
              <button class="btn btn-soft" type="button" data-action="detailBooking" data-booking-id="${escapeHtml(booking.id)}">Detail reservasi</button>
              <button class="btn btn-ghost" type="button" data-action="printBooking" data-booking-id="${escapeHtml(booking.id)}">Cetak bukti</button>
              ${bookingIsActive(booking) ? `<button class="btn btn-danger" type="button" data-action="cancelBooking" data-booking-id="${escapeHtml(booking.id)}">Batalkan booking</button>` : ""}
              ${canReview ? `<button class="btn btn-soft" type="button" data-action="openReview" data-booking-id="${escapeHtml(booking.id)}">Beri ulasan</button>` : ""}
            </div>
          </article>
        `;
      }

      function renderAdmin() {
        if (!isAdmin()) {
          return `
            <section class="section">
              <div class="container">
                <div class="empty-state">
                  <h2>Area Admin</h2>
                  <p>Halaman ini hanya dapat diakses oleh akun admin. Login dengan admin@hotel.test / admin123 untuk mencoba.</p>
                  <button class="btn btn-primary" type="button" data-action="openLogin">Login Admin</button>
                </div>
              </div>
            </section>
          `;
        }

        return `
          <section class="section admin-shell">
            <div class="container admin-layout">
              <aside class="admin-sidebar" aria-label="Menu admin">
                ${adminTabButton("dashboard", "Dashboard")}
                ${adminTabButton("hotels", "Manajemen Hotel")}
                ${adminTabButton("rooms", "Manajemen Kamar")}
                ${adminTabButton("bookings", "Manajemen Booking")}
                ${adminTabButton("users", "Manajemen Pengguna")}
                ${adminTabButton("reports", "Laporan")}
              </aside>

              <div class="admin-content">
                ${state.adminTab === "dashboard" ? renderAdminDashboard() : ""}
                ${state.adminTab === "hotels" ? renderAdminHotels() : ""}
                ${state.adminTab === "rooms" ? renderAdminRooms() : ""}
                ${state.adminTab === "bookings" ? renderAdminBookings() : ""}
                ${state.adminTab === "users" ? renderAdminUsers() : ""}
                ${state.adminTab === "reports" ? renderAdminReports() : ""}
              </div>
            </div>
          </section>
        `;
      }

      function adminTabButton(tab, label) {
        return `<button class="${state.adminTab === tab ? "active" : ""}" type="button" data-action="adminTab" data-tab="${tab}">${label}</button>`;
      }

      function renderAdminDashboard() {
        const hotels = getHotels();
        const bookings = getBookings();
        const revenue = bookings
          .filter(booking => ["Lunas", "Dikonfirmasi"].includes(booking.paymentStatus))
          .reduce((sum, booking) => sum + Number(booking.finalTotal || 0), 0);
        const recent = [...bookings].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 6);

        return `
          <div class="section-heading">
            <div>
              <span class="eyebrow">Dashboard</span>
              <h2>Ringkasan operasional</h2>
            </div>
          </div>

          <div class="stat-grid">
            <div class="stat-card"><strong>${hotels.length}</strong><span>Total hotel</span></div>
            <div class="stat-card"><strong>${getTotalRooms(hotels)}</strong><span>Total kamar tersedia</span></div>
            <div class="stat-card"><strong>${bookings.length}</strong><span>Total booking</span></div>
            <div class="stat-card"><strong>${currency(revenue)}</strong><span>Pendapatan dikonfirmasi</span></div>
          </div>

          <div class="admin-card">
            <div class="admin-toolbar">
              <div>
                <span class="eyebrow">Booking terbaru</span>
                <h3>Reservasi masuk</h3>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Kode</th>
                    <th>Tamu</th>
                    <th>Hotel</th>
                    <th>Tanggal</th>
                    <th>Pembayaran</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${recent.map(booking => `
                    <tr>
                      <td><strong>${escapeHtml(booking.proofNo)}</strong></td>
                      <td>${escapeHtml(booking.guest.name)}<br><span class="muted small">${escapeHtml(booking.guest.email)}</span></td>
                      <td>${escapeHtml(booking.hotelName)}</td>
                      <td>${formatDate(booking.checkIn)} - ${formatDate(booking.checkOut)}</td>
                      <td>${badge(booking.paymentStatus)}</td>
                      <td>${currency(booking.finalTotal)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderAdminHotels() {
        const hotels = getHotels();

        return `
          <div class="admin-card">
            <div class="admin-toolbar">
              <div>
                <span class="eyebrow">Manajemen Hotel</span>
                <h3>Tambah, edit, hapus, atur lokasi, fasilitas, dan foto hotel</h3>
              </div>
              <button class="btn btn-primary" type="button" data-action="openHotelModal">Tambah Hotel</button>
            </div>

            <div class="hotel-admin-grid">
              ${hotels.map(hotel => `
                <article class="hotel-admin-card">
                  <div style="display:flex; gap:14px; align-items:start;">
                    <img src="${escapeHtml(photosOf(hotel)[0])}" alt="${escapeHtml(hotel.name)}" style="width:96px; height:72px; object-fit:cover; border-radius:14px;" loading="lazy" />
                    <div>
                      <h4>${escapeHtml(hotel.name)}</h4>
                      <p class="muted small">${escapeHtml(hotel.location)}</p>
                      <p class="small">${(hotel.rooms || []).length} tipe kamar · ${getTotalRooms([hotel])} kamar tersedia</p>
                    </div>
                  </div>
                  <div class="facility-row">
                    ${hotel.facilities.slice(0, 5).map(item => `<span class="facility-chip">${escapeHtml(item)}</span>`).join("")}
                  </div>
                  <div class="card-actions">
                    <button class="btn btn-soft" type="button" data-action="openHotelModal" data-hotel-id="${escapeHtml(hotel.id)}">Edit</button>
                    <button class="btn btn-danger" type="button" data-action="deleteHotel" data-hotel-id="${escapeHtml(hotel.id)}">Hapus</button>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderAdminRooms() {
        const hotels = getHotels();
        if (!hotels.length) {
          return `
            <div class="empty-state">
              <h2>Belum ada hotel</h2>
              <p>Tambahkan hotel terlebih dahulu sebelum mengelola kamar.</p>
              <button class="btn btn-primary" type="button" data-action="openHotelModal">Tambah Hotel</button>
            </div>
          `;
        }

        let hotel = hotels.find(item => item.id === state.adminHotelId) || hotels[0];
        state.adminHotelId = hotel.id;

        return `
          <div class="admin-card">
            <div class="admin-toolbar">
              <div>
                <span class="eyebrow">Manajemen Kamar</span>
                <h3>Kelola tipe kamar, harga, ketersediaan, dan fasilitas kamar</h3>
              </div>
              <button class="btn btn-primary" type="button" data-action="openRoomModal" data-hotel-id="${escapeHtml(hotel.id)}">Tambah Kamar</button>
            </div>

            <div class="field" style="max-width:420px; margin-bottom:18px;">
              <label for="adminHotelSelect">Pilih hotel</label>
              <select id="adminHotelSelect" class="select" data-action="adminHotelSelect">
                ${hotels.map(item => `<option value="${escapeHtml(item.id)}" ${item.id === hotel.id ? "selected" : ""}>${escapeHtml(item.name)}</option>`).join("")}
              </select>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Tipe kamar</th>
                    <th>Harga / malam</th>
                    <th>Jumlah kamar</th>
                    <th>Ketersediaan</th>
                    <th>Fasilitas kamar</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  ${(hotel.rooms || []).map(room => `
                    <tr>
                      <td><strong>${escapeHtml(room.type)}</strong></td>
                      <td>${currency(room.price)}</td>
                      <td>${escapeHtml(room.available)}</td>
                      <td>${getRoomAvailability(hotel.id, room.type, "", "")} tersedia</td>
                      <td>${(room.facilities || []).map(item => `<span class="facility-chip">${escapeHtml(item)}</span>`).join("")}</td>
                      <td>
                        <div class="card-actions">
                          <button class="btn btn-soft" type="button" data-action="openRoomModal" data-hotel-id="${escapeHtml(hotel.id)}" data-room-id="${escapeHtml(room.id)}">Edit</button>
                          <button class="btn btn-danger" type="button" data-action="deleteRoom" data-hotel-id="${escapeHtml(hotel.id)}" data-room-id="${escapeHtml(room.id)}">Hapus</button>
                        </div>
                      </td>
                    </tr>
                  `).join("") || `<tr><td colspan="6" class="muted">Belum ada kamar untuk hotel ini.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderAdminBookings() {
        const bookings = [...getBookings()].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const filters = ["all", "Menunggu Pembayaran", "Dikonfirmasi", "Lunas", "Refund", "Dibatalkan"];

        const visible = state.adminBookingFilter === "all"
          ? bookings
          : bookings.filter(booking => booking.paymentStatus === state.adminBookingFilter);

        return `
          <div class="admin-card">
            <div class="admin-toolbar">
              <div>
                <span class="eyebrow">Manajemen Booking</span>
                <h3>Lihat semua reservasi, konfirmasi, ubah status pembayaran, dan refund</h3>
              </div>
            </div>

            <div class="card-actions" style="margin-bottom:18px; flex-wrap:wrap;">
              ${filters.map(filter => `
                <button class="btn ${state.adminBookingFilter === filter ? "btn-primary" : "btn-ghost"}" type="button" data-action="adminBookingFilter" data-filter="${escapeHtml(filter)}">
                  ${filter === "all" ? "Semua" : escapeHtml(filter)}
                </button>
              `).join("")}
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Kode</th>
                    <th>Tamu</th>
                    <th>Hotel / Kamar</th>
                    <th>Tanggal</th>
                    <th>Status</th>
                    <th>Pembayaran</th>
                    <th>Total</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody>

      function renderAdminReports() {
        const hotels = getHotels();
        const bookings = getBookings();
        const revenue = bookings
          .filter(booking => ["Lunas", "Dikonfirmasi"].includes(booking.paymentStatus))
          .reduce((sum, booking) => sum + Number(booking.finalTotal || 0), 0);

        const topHotels = hotels.map(hotel => ({
          hotel,
          count: bookings.filter(booking => booking.hotelId === hotel.id).length
        })).sort((a, b) => b.count - a.count);

        const maxHotelCount = Math.max(...topHotels.map(item => item.count), 1);

        const months = Array.from({ length: 12 }, (_, index) => {
          const date = new Date();
          date.setMonth(date.getMonth() - 11 + index);
          date.setDate(1);
          date.setHours(0, 0, 0, 0);
          return date.toISOString().slice(0, 7);
        });

        const monthly = months.map(key => {
          const label = new Date(key + "-01").toLocaleDateString("id-ID", { month: "short" });
          const monthBookings = bookings.filter(booking => String(booking.createdAt).slice(0, 7) === key);
          return {
            key,
            label,
            count: monthBookings.length,
            revenue: monthBookings
              .filter(booking => ["Lunas", "Dikonfirmasi"].includes(booking.paymentStatus))
              .reduce((sum, booking) => sum + Number(booking.finalTotal || 0), 0)
          };
        });
        const maxCount = Math.max(...monthly.map(item => item.count), 1);

        return `
          <div class="section-heading">
            <div>
              <span class="eyebrow">Laporan</span>
              <h2>Laporan booking, pendapatan, dan statistik</h2>
            </div>
          </div>

          <div class="stat-grid">
            <div class="stat-card"><strong>${bookings.length}</strong><span>Total booking</span></div>
            <div class="stat-card"><strong>${currency(revenue)}</strong><span>Pendapatan</span></div>
            <div class="stat-card"><strong>${hotels.length}</strong><span>Total hotel</span></div>
            <div class="stat-card"><strong>${getTotalRooms(hotels)}</strong><span>Total kamar</span></div>
          </div>

          <div class="admin-card">
            <span class="eyebrow">Hotel paling banyak dipesan</span>
            <h3 style="margin-bottom:18px;">Popularitas berdasarkan jumlah reservasi</h3>
            <div class="bar-list">
              ${topHotels.map(item => `
                <div class="bar-row">
                  <span>${escapeHtml(item.hotel.name)}</span>
                  <div class="bar"><i style="width:${Math.round(item.count / maxHotelCount * 100)}%"></i></div>
                  <strong>${item.count}</strong>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="admin-card">
            <span class="eyebrow">Statistik bulanan</span>
            <h3 style="margin-bottom:18px;">Jumlah booking per bulan</h3>
            <div class="bar-list">
              ${monthly.map(item => `
                <div class="bar-row">
                  <span>${escapeHtml(item.label)}</span>
                  <div class="bar"><i style="width:${Math.round(item.count / maxCount * 100)}%"></i></div>
                  <strong>${item.count}</strong>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="admin-card">
            <span class="eyebrow">Laporan booking</span>
            <h3 style="margin-bottom:18px;">Riwayat reservasi lengkap</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Kode</th>
                    <th>Tamu</th>
                    <th>Hotel</th>
                    <th>Tanggal</th>
                    <th>Status</th>
                    <th>Pembayaran</th>
                    <th>Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${bookings.map(booking => `
                    <tr>
                      <td>${escapeHtml(booking.proofNo)}</td>
                      <td>${escapeHtml(booking.guest.name)}</td>
                      <td>${escapeHtml(booking.hotelName)}</td>
                      <td>${formatDate(booking.checkIn)}</td>
                      <td>${badge(booking.status)}</td>
                      <td>${badge(booking.paymentStatus)}</td>
                      <td>${currency(booking.finalTotal)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
